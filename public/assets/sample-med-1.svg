  <rect x="80" y="50" width="240" height="200" rx="16" fill="#FFFFFF" stroke="#0E7C86" stroke-width="4"/>
  <rect x="80" y="50" width="240" height="40" rx="16" fill="#0E7C86"/>
  <rect x="80" y="70" width="240" height="20" fill="#0E7C86"/>
  <text x="200" y="76" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ORIGINAL SEALED PACK</text>
  
  <!-- Tablets row 1 -->
  <circle cx="130" cy="130" r="22" fill="#E6F4F5" stroke="#4ADE9C" stroke-width="3"/>
