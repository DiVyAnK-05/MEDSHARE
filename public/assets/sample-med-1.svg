  <circle cx="270" cy="130" r="22" fill="#E6F4F5" stroke="#4ADE9C" stroke-width="3"/>

  <!-- Tablets row 2 -->
  <circle cx="130" cy="190" r="22" fill="#E6F4F5" stroke="#4ADE9C" stroke-width="3"/>
  <circle cx="200" cy="190" r="22" fill="#E6F4F5" stroke="#4ADE9C" stroke-width="3"/>
  <circle cx="270" cy="190" r="22" fill="#E6F4F5" stroke="#4ADE9C" stroke-width="3"/>

