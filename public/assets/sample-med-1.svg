  <rect x="110" y="225" width="180" height="26" rx="13" fill="#4ADE9C"/>
  <text x="200" y="243" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0B1F2A" text-anchor="middle">✓ VERIFIED &amp; UNEXPIRED</text>
