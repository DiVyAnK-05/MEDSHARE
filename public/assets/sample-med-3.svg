<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#F3F8F9"/>
  <!-- Bottle or box -->
  <rect x="130" y="60" width="140" height="190" rx="12" fill="#FFFFFF" stroke="#0E7C86" stroke-width="4"/>
  <!-- Cap -->
  <rect x="160" y="38" width="80" height="24" rx="6" fill="#FFB224"/>
  <!-- Label -->
  <rect x="140" y="100" width="120" height="120" rx="8" fill="#E6F4F5"/>
  <circle cx="200" cy="140" r="20" fill="#4ADE9C"/>
  <text x="200" y="146" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0B1F2A" text-anchor="middle">+</text>
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0E7C86" text-anchor="middle">SUPPLEMENTS</text>
  <text x="200" y="200" font-family="Arial, sans-serif" font-size="9" fill="#526E7A" text-anchor="middle">SEAL INTACT</text>
</svg>
