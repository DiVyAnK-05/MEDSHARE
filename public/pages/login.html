<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | MedShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header" role="banner">
    <div class="container navbar">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon-box" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/>
            <path d="m8.5 8.5 7 7"/>
          </svg>
        </div>
        <span>MedShare</span>
      </a>

      <nav class="nav-menu" id="main-nav-links">
        <a href="/pages/browse.html" class="nav-link">Find Medicine</a>
        <a href="/pages/verification.html" class="nav-link">How It Works</a>
        <a href="/pages/safety.html" class="nav-link">Safety Rules</a>
      </nav>

      <div class="nav-actions" id="navbar-auth-actions">
        <a href="/pages/signup.html" class="btn btn-outline-teal btn-sm">Create Account</a>
      </div>
    </div>
  </header>

  <main id="main-content" class="section-padding">
    <div class="container" style="max-width: 480px;">
      <div class="card" style="padding: 36px 32px;">
        <div style="text-align: center; margin-bottom: 28px;">
          <h1 style="font-size: var(--font-size-2xl); margin-bottom: 8px;">Welcome Back</h1>
          <p style="font-size: var(--font-size-sm);">Log in to manage your medicine donations and requests</p>
        </div>

        <!-- Quick Fill Credentials Box -->
        <div style="background: var(--color-cloud-white); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 14px; margin-bottom: 24px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span style="font-size: 11px; font-weight: 700; color: var(--color-deep-slate); text-transform: uppercase; letter-spacing: 0.5px;">⚡ Quick-Fill Credentials:</span>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <button type="button" class="btn btn-secondary btn-sm" id="fill-admin-btn" style="font-size: 11px; padding: 6px;">Admin</button>
            <button type="button" class="btn btn-secondary btn-sm" id="fill-donor-btn" style="font-size: 11px; padding: 6px;">Donor</button>
            <button type="button" class="btn btn-secondary btn-sm" id="fill-receiver-btn" style="font-size: 11px; padding: 6px;">Receiver</button>
            <button type="button" class="btn btn-secondary btn-sm" id="fill-ngo-btn" style="font-size: 11px; padding: 6px;">NGO Partner</button>
          </div>
        </div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email" class="form-label">Email Address <span class="required">*</span></label>
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <label for="password" class="form-label" style="margin-bottom: 0;">Password <span class="required">*</span></label>
              <a href="/pages/forgot-password.html" style="font-size: var(--font-size-xs);">Forgot password?</a>
            </div>
            <div style="position: relative;">
              <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" style="padding-right: 42px;">
              <button type="button" id="toggle-pwd-btn" aria-label="Toggle password visibility" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--color-text-muted);">
                👁️
              </button>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 24px;">
            <label class="form-checkbox-label">
              <input type="checkbox" id="remember-me" checked>
              <span>Keep me logged in on this browser</span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">
            Log In to MedShare
          </button>
        </form>

        <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--color-border); font-size: var(--font-size-sm);">
          Don't have an account? <a href="/pages/signup.html" style="font-weight: 600;">Sign up as a Donor or Receiver</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { API } from '/js/api.js';
    import { clearUserCache } from '/js/auth.js';
    import { showToast, applyAccessibilitySettings } from '/js/ui.js';
    import { isValidEmail, clearFormErrors, setFieldError } from '/js/validation.js';

    // Show/hide password
    const pwdInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-pwd-btn');
    toggleBtn.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      toggleBtn.setAttribute('aria-label', isPwd ? 'Hide password' : 'Show password');
    });

    // Quick fills for teacher/evaluator
    document.getElementById('fill-admin-btn').addEventListener('click', () => {
      document.getElementById('email').value = 'admin@medshare.org';
      document.getElementById('password').value = 'Admin@12345';
    });
    document.getElementById('fill-donor-btn').addEventListener('click', () => {
      document.getElementById('email').value = 'donor@kiet.edu';
      document.getElementById('password').value = 'Donor@12345';
    });
    document.getElementById('fill-receiver-btn').addEventListener('click', () => {
      document.getElementById('email').value = 'receiver@kiet.edu';
      document.getElementById('password').value = 'Receiver@12345';
    });
    document.getElementById('fill-ngo-btn').addEventListener('click', () => {
      document.getElementById('email').value = 'ngo@pehchaan.org';
      document.getElementById('password').value = 'NgoPartner@12345';
    });

    // Form submit
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearFormErrors(form);

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      let valid = true;
      if (!isValidEmail(email)) {
        setFieldError(document.getElementById('email'), 'Please enter a valid email address');
        valid = false;
      }
      if (!password) {
        setFieldError(document.getElementById('password'), 'Password is required');
        valid = false;
      }

      if (!valid) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      try {
        const res = await API.auth.login({ email, password });
        showToast(res.message || 'Login successful!', 'success');
        clearUserCache();

        // Redirect logic
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect');

        setTimeout(() => {
          if (redirect && redirect.startsWith('/')) {
            window.location.href = decodeURIComponent(redirect);
          } else if (res.data?.user?.role === 'admin') {
            window.location.href = '/pages/admin.html';
          } else {
            window.location.href = '/pages/dashboard.html';
          }
        }, 600);
      } catch (err) {
        showToast(err.message || 'Invalid email or password', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In to MedShare';
      }
    });
  </script>
</body>
</html>
