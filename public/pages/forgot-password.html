<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | MedShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header" role="banner">
    <div class="container navbar">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon-box" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/>
            <path d="m8.5 8.5 7 7"/>
          </svg>
        </div>
        <span>MedShare</span>
      </a>
      <div class="nav-actions">
        <a href="/pages/login.html" class="btn btn-secondary btn-sm">Back to Login</a>
      </div>
    </div>
  </header>

  <main id="main-content" class="section-padding">
    <div class="container" style="max-width: 460px;">
      <div class="card" style="padding: 36px 32px;">
        <div style="text-align: center; margin-bottom: 24px;">
          <h1 style="font-size: var(--font-size-2xl); margin-bottom: 8px;">Reset Password</h1>
          <p style="font-size: var(--font-size-sm);">Enter your registered email address and we'll generate a secure password reset link.</p>
        </div>

        <form id="forgot-form">
          <div class="form-group">
            <label for="email" class="form-label">Email Address <span class="required">*</span></label>
            <input type="email" id="email" class="form-control" placeholder="name@kiet.edu" required>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="submit-btn">
            Send Reset Instructions
          </button>
        </form>

        <div id="result-box" style="display: none; margin-top: 20px;" class="alert-banner alert-info">
          <div id="result-text" style="font-size: 14px;"></div>
        </div>

        <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--color-border); font-size: var(--font-size-sm);">
          Remembered your password? <a href="/pages/login.html">Log in here</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { API } from '/js/api.js';
    import { showToast } from '/js/ui.js';
    import { isValidEmail } from '/js/validation.js';

    const form = document.getElementById('forgot-form');
    const submitBtn = document.getElementById('submit-btn');
    const resultBox = document.getElementById('result-box');
    const resultText = document.getElementById('result-text');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();

      if (!isValidEmail(email)) {
        showToast('Please enter a valid email address', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Generating Link...';

      try {
        const res = await API.auth.forgotPassword(email);
        resultBox.style.display = 'flex';
        let msg = res.message;
        if (res.devResetUrl) {
          msg += `<br><br><strong>Development Link:</strong> <a href="${res.devResetUrl}" style="word-break:break-all;">${res.devResetUrl}</a>`;
        }
        resultText.innerHTML = msg;
        showToast('Password reset link generated!', 'success');
      } catch (err) {
        showToast(err.message || 'Error requesting reset', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Instructions';
      }
    });
  </script>
</body>
</html>
