<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | MedShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header" role="banner">
    <div class="container navbar">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon-box" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/>
            <path d="m8.5 8.5 7 7"/>
          </svg>
        </div>
        <span>MedShare</span>
      </a>
    </div>
  </header>

  <main id="main-content" class="section-padding">
    <div class="container" style="max-width: 460px;">
      <div class="card" style="padding: 36px 32px;">
        <div style="text-align: center; margin-bottom: 24px;">
          <h1 style="font-size: var(--font-size-2xl); margin-bottom: 8px;">Create New Password</h1>
          <p style="font-size: var(--font-size-sm);">Enter your new secure password below to regain account access.</p>
        </div>

        <form id="reset-form">
          <div class="form-group">
            <label for="password" class="form-label">New Password <span class="required">*</span></label>
            <input type="password" id="password" class="form-control" placeholder="Min. 8 characters" required>
            <div class="form-helper">Must include uppercase, lowercase, and a number</div>
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirm New Password <span class="required">*</span></label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat new password" required>
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">
            Update Password &amp; Log In
          </button>
        </form>
      </div>
    </div>
  </main>

  <script type="module">
    import { API } from '/js/api.js';
    import { clearUserCache } from '/js/auth.js';
    import { showToast } from '/js/ui.js';
    import { isValidPassword } from '/js/validation.js';

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      alert('Password reset token is missing or invalid.');
      window.location.href = '/pages/forgot-password.html';
    }

    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!isValidPassword(password)) {
        showToast('Password must be at least 8 characters with mixed case and a number', 'error');
        return;
      }
      if (password !== confirmPassword) {
        showToast('Passwords do not match', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting...';

      try {
        const res = await API.auth.resetPassword(token, password);
        showToast(res.message || 'Password reset successful!', 'success');
        clearUserCache();
        setTimeout(() => {
          window.location.href = '/pages/dashboard.html';
        }, 1000);
      } catch (err) {
        showToast(err.message || 'Error resetting password', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password & Log In';
      }
    });
  </script>
</body>
</html>
